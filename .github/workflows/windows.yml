name: Native platform verification and installers
on:
  push:
    branches: [main, 'validation/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
          - os: macos-26
            platform: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SITECAD_TEST_FRESH_INSTALL: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Codex for catalog and runtime verification
        run: node scripts/install-codex.mjs runtime
      - name: Unit, integration and fresh native launcher installation
        shell: bash
        run: |
          mkdir -p dist/verification
          set -o pipefail
          npm test 2>&1 | tee dist/verification/tests.txt
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Native KCSC installation and platform support
        env:
          SITECAD_TEST_KCSC_INSTALL: '1'
        run: node --test tests/kcsc-native-install.test.mjs
      - name: Build macOS local web ZIP
        if: runner.os == 'macOS'
        run: node scripts/build-local-web.mjs
      - name: Build Windows local web ZIP
        if: runner.os == 'Windows'
        run: node scripts/build-local-web.mjs --windows
      - name: Install pinned Windows setup compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.6.1.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_6_1/innosetup-6.6.1.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() -ne 'd243ce440c02705530699554fb9612b9b2bd7a2a90629cdb7f41e66f5faeb91f') { throw 'Setup compiler integrity mismatch' }
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'Inno Setup'
          $install = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$compilerRoot`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Compiler installation failed: $($install.ExitCode)" }
          "INNO_SETUP_COMPILER=$compilerRoot\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build native desktop installer
        run: npm run desktop:build
      - name: Mount final macOS DMG, record trust status and verify restart
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find dist -maxdepth 1 -name 'SiteCAD-*-macOS-*.dmg' -print -quit)
          mount="$RUNNER_TEMP/sitecad-dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/SiteCAD.app" "$RUNNER_TEMP/SiteCAD.app"
          codesign -dv --verbose=2 "$RUNNER_TEMP/SiteCAD.app" > dist/verification/mac-signature.txt 2>&1
          spctl --assess --type execute -vv "$RUNNER_TEMP/SiteCAD.app" > dist/verification/mac-gatekeeper.txt 2>&1 || true
          node scripts/verify-desktop.mjs "$RUNNER_TEMP/SiteCAD.app/Contents/MacOS/SiteCAD" "$PWD/dist/verification"
          node scripts/verify-desktop.mjs "$RUNNER_TEMP/SiteCAD.app/Contents/MacOS/SiteCAD" "$PWD/dist/verification/desktop-restart"
      - name: Install Windows setup, verify forced and normal restarts, preserve drawings on uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem 'dist/SiteCAD-*-Windows-x64-Setup.exe' | Select-Object -First 1).FullName
          Get-AuthenticodeSignature $setup | Select-Object Status,StatusMessage | ConvertTo-Json | Out-File dist/verification/windows-signature.json
          $destination = Join-Path $env:RUNNER_TEMP '설치 확인 SiteCAD'
          $install = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "SiteCAD installation failed: $($install.ExitCode)" }
          node scripts/verify-desktop.mjs "$destination\SiteCAD.exe" "$PWD/dist/verification"
          if ($LASTEXITCODE -ne 0) { throw 'Desktop verification failed' }
          node scripts/verify-desktop.mjs "$destination\SiteCAD.exe" "$PWD/dist/verification/desktop-restart" --normal-close
          if ($LASTEXITCODE -ne 0) { throw 'Desktop recovery or normal-close verification failed' }
          node scripts/verify-desktop.mjs "$destination\SiteCAD.exe" "$PWD/dist/verification/desktop-normal-restart" --normal-close
          if ($LASTEXITCODE -ne 0) { throw 'Desktop restart after normal close failed' }
          New-Item "$destination\drawings" -ItemType Directory -Force | Out-Null
          Set-Content "$destination\drawings\preserve.txt" 'User drawing placeholder'
          $uninstall = Start-Process "$destination\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or !(Test-Path "$destination\drawings\preserve.txt")) { throw 'Uninstaller removed a user drawing or failed' }
          @{ installed=$true; forcedRestart=$true; normalRestart=$true; closeConfirmationVerified=$true; uninstallSucceeded=$true; userDrawingPreserved=$true } | ConvertTo-Json | Out-File dist/verification/windows-install.json
      - name: Upgrade previous public desktop and preserve drawings and settings
        run: node scripts/verify-desktop-upgrade.mjs
      - name: Save platform installers and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SiteCAD-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/*local-web-*.zip
            dist/*.dmg
            dist/*-Setup.exe
            dist/verification/
          retention-days: 14
